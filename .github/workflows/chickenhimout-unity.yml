name: ChickenHimOut Unity Validation

on:
  pull_request:
    paths:
      - 'ChickenHimOut-World-Game/game/ChickenHimOut/**'
      - '.github/workflows/chickenhimout-unity.yml'
  workflow_dispatch:

concurrency:
  group: chickenhimout-unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Unity root
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ChickenHimOut-World-Game/game/ChickenHimOut'
          test -f "$ROOT/ProjectSettings/ProjectVersion.txt"
          grep -q '6000.5.4f1' "$ROOT/ProjectSettings/ProjectVersion.txt"
          test -d "$ROOT/Assets/Game"
          test ! -d 'ChickenHimOut-World-Game/Assets/ChickenHimOut'
          echo 'Canonical Unity root contract passed.'

  unity-tests:
    if: ${{ secrets.UNITY_LICENSE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ChickenHimOut-World-Game/game/ChickenHimOut
          unityVersion: 6000.5.4f1
          testMode: EditMode
          artifactsPath: artifacts/tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts/tests

  android-development-build:
    if: ${{ secrets.UNITY_LICENSE != '' }}
    needs: unity-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ChickenHimOut-World-Game/game/ChickenHimOut
          unityVersion: 6000.5.4f1
          targetPlatform: Android
          androidExportType: androidPackage
          customParameters: -executeMethod ChickenHimOut.Game.Editor.PrototypeBuildPipeline.BuildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: chickenhimout-android-development
          path: build/Android
